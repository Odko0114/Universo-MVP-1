<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Universo — Marketing OS</title>
    <link rel="icon" href="/favicon.svg?v=3" />
    <style>
      :root {
        --bg: #f5f7fb; --surface: #ffffff; --surface-2: #eef1f6;
        --ink: #10233f; --soft: #45566e; --faint: #6b7688; --line: #e1e6ee;
        --navy: #0b1f3a; --teal: #0d9488; --teal-bg: #e6f7f4; --gold: #e9b949;
        --danger: #d64550; --radius: 14px;
        --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      :root[data-theme="dark"] {
        --bg: #1c1b1a; --surface: #292826; --surface-2: #201e1c;
        --ink: #eeede9; --soft: #bebbb4; --faint: #949089; --line: rgba(255,255,255,0.11);
        --navy: #242322; --teal: #46cdb6; --teal-bg: rgba(70,205,182,0.12); --gold: #f2be5b;
        --danger: #ec6f79; color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
      a { color: var(--teal); }
      button { font-family: inherit; }
      header { background: var(--navy); color: #fff; padding: 14px 18px; position: sticky; top: 0; z-index: 20; }
      .head-in { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: #fff; }
      .brand svg { width: 26px; height: 26px; color: #fff; }
      .brand b { font-weight: 800; font-style: italic; letter-spacing: -0.01em; }
      .brand small { color: var(--gold); font-size: 0.72rem; font-weight: 700; }
      .save-state { margin-left: auto; font-size: 0.8rem; color: #cdd7e6; }
      .save-state.saving { color: var(--gold); }
      .save-state.saved { color: #7fe0cf; }
      .save-state.error { color: #ffb0b0; }
      .tabs { max-width: 900px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; }
      .tabs button { border: 0; background: rgba(255,255,255,0.08); color: #dfe6f2; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor: pointer; min-height: 40px; }
      .tabs button.on { background: var(--gold); color: var(--navy); }
      main { max-width: 900px; margin: 0 auto; padding: 18px; }
      .panel { display: none; } .panel.on { display: block; }
      h1 { font-size: 1.35rem; margin: 4px 0; }
      h2 { font-size: 1.02rem; margin: 20px 0 10px; }
      .sub { color: var(--soft); font-size: 0.9rem; margin: 0 0 14px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
      label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--soft); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 5px; }
      input, select, textarea { width: 100%; font-family: inherit; font-size: 0.95rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); min-height: 44px; }
      textarea { resize: vertical; min-height: 80px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1; min-width: 140px; }
      .field { margin-bottom: 12px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 11px 16px; min-height: 44px; font-weight: 700; font-size: 0.9rem; cursor: pointer; background: var(--teal); color: #fff; }
      .btn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
      .btn.gold { background: var(--gold); color: var(--navy); }
      .btn.sm { padding: 7px 11px; min-height: 36px; font-size: 0.82rem; }
      .muted { color: var(--faint); font-size: 0.85rem; }
      .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; background: var(--surface-2); color: var(--soft); }
      .pill.teal { background: var(--teal-bg); color: var(--teal); }
      .pill.overdue { background: rgba(214,69,80,0.15); color: var(--danger); }
      .pill.soon { background: rgba(233,185,73,0.18); color: #916609; }
      :root[data-theme="dark"] .pill.soon { color: var(--gold); }
      .plan-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 9px 0; border-bottom: 1px solid var(--line); }
      .plan-row:last-child { border-bottom: 0; }
      .pr-title { flex: 1; min-width: 150px; font-weight: 600; font-size: 0.92rem; }
      .plan-row .btn { margin-left: auto; }
      /* Radar / intelligence */
      .radar-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .radar-top h1 { margin: 4px 0; }
      .mode-toggle { margin-left: auto; display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
      .mode-toggle .chip-btn { border: 0; min-height: 34px; padding: 6px 12px; }
      .mode-toggle .chip-btn.on { background: var(--teal); color: #fff; }
      .action { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer; font-size: 0.92rem; font-weight: 600; }
      .action:hover { border-color: var(--teal); }
      .warn { background: rgba(233,185,73,0.12); border-color: rgba(233,185,73,0.4); }
      .opp { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--surface); }
      .opp-head { display: flex; gap: 8px; margin-bottom: 8px; }
      .opp-angle { font-weight: 800; font-size: 1.02rem; margin-bottom: 6px; }
      .opp-why { font-size: 0.88rem; color: var(--soft); margin-bottom: 8px; }
      .opp-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: var(--soft); margin-bottom: 6px; }
      .opp-hooks { font-size: 0.86rem; margin-bottom: 6px; } .opp-hooks ul { margin: 4px 0 0; padding-left: 18px; } .opp-hooks li { margin: 2px 0; }
      .opp-src { font-size: 0.82rem; color: var(--faint); margin-bottom: 10px; }
      .opp-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .opp-prompt { margin: 10px 0 0; padding: 11px; white-space: pre-wrap; word-wrap: break-word; font-size: 0.82rem; background: var(--surface-2); border-radius: 8px; }
      .head-item { padding: 8px 0; border-bottom: 1px solid var(--line); }
      .head-item:last-child { border-bottom: 0; }
      .head-title { display: inline-block; font-weight: 600; font-size: 0.9rem; }
      .head-meta { font-size: 0.78rem; color: var(--faint); margin-top: 3px; }
      .link-mini { border: 0; background: none; color: var(--teal); font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; padding: 0; }
      .cal-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .cal-row:last-child { border-bottom: 0; }
      .cal-day { flex: 0 0 78px; font-size: 0.86rem; }
      .cal-body { flex: 1; min-width: 0; }
      .cal-theme { font-size: 0.82rem; color: var(--soft); font-weight: 600; }
      .cal-ideas { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
      .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
      .modal-in { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; max-width: 620px; width: 100%; padding: 22px; position: relative; margin: auto; }
      .modal-x { position: absolute; top: 12px; right: 14px; border: 0; background: var(--surface-2); color: var(--ink); width: 34px; height: 34px; border-radius: 999px; font-size: 1.2rem; cursor: pointer; }
      .prod-sec { border-top: 1px solid var(--line); padding: 12px 0; }
      .prod-h { font-size: 0.76rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--soft); margin-bottom: 6px; }
      .prod-shots { margin: 4px 0; padding-left: 20px; } .prod-shots li { margin: 3px 0; }
      #prod-cap { margin: 0; padding: 10px; white-space: pre-wrap; font-size: 0.86rem; background: var(--surface-2); border-radius: 8px; }
      .prod-check { display: flex; align-items: center; gap: 8px; text-transform: none; font-size: 0.9rem; color: var(--ink); font-weight: 500; margin: 4px 0; }
      .prod-check input { width: auto; min-height: auto; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip-btn { border: 1px solid var(--line); background: var(--surface); color: var(--soft); border-radius: 999px; padding: 8px 12px; font-size: 0.82rem; cursor: pointer; min-height: 40px; }
      .chip-btn.on { border-color: var(--teal); color: var(--teal); font-weight: 700; }
      .chip-btn.used { color: var(--faint); text-decoration: line-through; }
      .out-block { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
      .out-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surface-2); flex-wrap: wrap; }
      .out-head b { font-size: 0.9rem; }
      .out-head .btn { margin-left: auto; }
      .out-block pre { margin: 0; padding: 12px; white-space: pre-wrap; word-wrap: break-word; font-family: inherit; font-size: 0.88rem; color: var(--ink); background: var(--surface); }
      .tag { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 800; color: #fff; padding: 2px 7px; border-radius: 5px; }
      .tag.prompt { background: var(--teal); } .tag.draft { background: var(--gold); color: var(--navy); }
      .seed { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; cursor: pointer; font-size: 0.88rem; }
      .seed:hover { border-color: var(--teal); }
      .seed .pill { margin-right: 7px; }
      .idea-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
      .idea-item .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .idea-item b { flex: 1; min-width: 160px; }
      .idea-item select { flex: 0 0 auto; width: auto; min-height: 40px; padding: 6px 10px; }
      #gate { max-width: 380px; margin: 12vh auto; }
      @media (max-width: 560px) { main { padding: 14px; } .out-head .btn { margin-left: 0; } .btn.sm, .chip-btn { min-height: 40px; } .opp-actions .btn { flex: 1; } }
    </style>
  </head>
  <body>
    <header>
      <div class="head-in">
        <a class="brand" href="/admin"><!--BRAND_MARK--><span style="display:flex;flex-direction:column;line-height:1"><b>Universo</b><small>MARKETING OS</small></span></a>
        <div class="save-state" id="saveState"></div>
      </div>
      <nav class="tabs" id="tabs" hidden>
        <button data-tab="radar" class="on">🔥 What's Happening</button>
        <button data-tab="plan">Plan</button>
        <button data-tab="calendar">Calendar</button>
        <button data-tab="create">Create</button>
        <button data-tab="ideas">Ideas</button>
        <button data-tab="library">Library</button>
        <button data-tab="brain">Brand Brain</button>
      </nav>
    </header>

    <main>
      <div class="card" id="gate">
        <h1>Marketing OS</h1>
        <p class="sub">Sign in with your Universo account.</p>
        <div class="field"><label>Email</label><input id="g-email" type="email" autocomplete="username" /></div>
        <div class="field"><label>Password</label><input id="g-pass" type="password" autocomplete="current-password" /></div>
        <div id="g-err" class="muted" style="color:var(--danger);margin-bottom:10px" hidden></div>
        <button class="btn" id="g-btn" style="width:100%">Sign in</button>
      </div>
      <div id="app" hidden></div>
    </main>

    <div id="produce-modal" class="modal" hidden><div class="modal-in"><button class="modal-x" id="produce-close" aria-label="Close">×</button><div id="produce-body"></div></div></div>

    <script>
      // ===== Library (version-controlled) =====
      const BRAND_SEED = {
        mission: "Where you're born shouldn't determine how you begin. Universo helps future students discover European universities and the scholarships that can fund them — free, honest, no invented data.",
        product: "Discover 2,899 universities across 32 European countries (from the EU's official register, ETER), 300 hand-verified in depth. Match to what fits you, see real government scholarships you can actually use, compare side by side, and build a free Dream Plan to save, plan and track applications & deadlines. Free forever — funded by universities, not students.",
        audience: "Future/international students (esp. from Mongolia and other non-EU countries) who want to study in Europe — plus their parents. Mostly on phones, high intent, anxious about cost, eligibility and the process.",
        pains: "• Don't know where they can actually afford to study\n• Scholarships are scattered and confusing\n• Fear of hidden costs\n• Overwhelmed by requirements and deadlines\n• Agents overcharge\n• Language-requirement confusion\n• \"Is my degree even eligible?\"",
        tone: "Honest, warm, clear, encouraging. Plain language, no hype, no jargon. \"Same Start. Equal Chance.\" Never overstate traction; every number traceable to a source.",
        donot: "Never invent tuition, eligibility, deadlines or scholarship figures. Never overstate how many people use it. Don't sound like a generic AI or a pushy agent.",
        facts: "2,899 universities · 32 European countries · 300 hand-verified profiles · sourced from the EU register (ETER) · free forever",
        faqs: "• Is it free? Yes — funded by universities, not students.\n• Is the data accurate? Every uni is from the EU register; 300 are hand-verified.\n• Do I need an account? No to browse; an account lets you save & plan.\n• How is it different from Googling? It matches unis to you, tells you why, and puts real tuition/deadlines/language side by side.\n• Which countries? 32 across Europe."
      };
      const FORMULAS = [
        { id: "pain", name: "Student Pain Point", steps: ["Hook (name the pain)", "The problem in their words", "Why it happens", "The better way", "How Universo helps", "CTA"] },
        { id: "discovery", name: "University Discovery", steps: ["Hook", "The university", "One surprising fact", "Why a student should care", "CTA"] },
        { id: "advice", name: "Application Advice", steps: ["The problem", "The common mistake", "The better approach", "A concrete example", "CTA"] },
        { id: "founder", name: "Founder Story", steps: ["An observation", "A short personal story", "The lesson", "Connect to Universo", "CTA"] },
        { id: "feature", name: "Product Feature", steps: ["The problem", "Life before", "Universo", "Life after", "CTA"] },
        { id: "myth", name: "Myth vs Fact", steps: ["The myth", "Why people believe it", "The fact (with source)", "What to do instead", "CTA"] },
        { id: "list", name: "Listicle", steps: ["Hook (number + promise)", "Point 1", "Point 2", "Point 3", "The best one", "CTA"] },
        { id: "scholarship", name: "Scholarship Spotlight", steps: ["Hook", "The scholarship", "What it covers", "Who it's for", "How Universo helps you use it", "CTA"] }
      ];
      const HOOKS = [
        "Most students think {X}. Here's what actually happens.", "You can study in {country} for €0. Here's how.", "The scholarship nobody tells you about.", "I checked 2,899 universities so you don't have to.", "Applying abroad? Avoid this €{X} mistake.", "POV: you just found out {country} has free tuition.", "3 scholarships for {country} students closing soon.", "Your dream university might be cheaper than you think.", "Nobody explains this about studying abroad.", "Stop paying an agent €{X}. Do this instead.", "Studying in Europe isn't just for rich kids. Proof:", "Save this before you apply anywhere."
      ];
      const CTAS = { Discover: "Find your matches free on Universo — link in bio.", Save: "Save your shortlist so you never lose it.", "Sign up": "Build your free Dream Plan in 20 seconds.", Scholarship: "See which scholarships you can actually use — free." };
      const ANGLES = ["Tuition cost", "Hidden costs", "Scholarships", "Budgeting", "Application mistakes", "Country comparison", "A student's story", "Myth-busting", "Deadlines & timeline", "Eligibility", "Language requirements", "Parents' perspective"];
      const PLATFORMS = {
        reel: { name: "Reel / TikTok script", rule: "15–45s spoken script. Ruthless 2-second hook. One idea only. Suggest on-screen text beats. End on the CTA. ~90–150 words." },
        ig: { name: "Instagram caption", rule: "Strong first line (the hook), then value in short lines with breaks, then CTA. 3–5 relevant hashtags. ~50–120 words." },
        linkedin: { name: "LinkedIn post", rule: "Founder/professional voice. A story or insight, not a brochure. No hashtag spam. ~120–200 words." },
        reddit: { name: "Reddit post", rule: "Genuine and value-first — no marketing tone. Help first, mention Universo subtly at most once, and end with a question to spark replies." },
        x: { name: "X / Twitter", rule: "One punchy hook, ≤280 characters. Optionally note a 3-tweet thread outline." },
        story: { name: "Story", rule: "One bold line + an interactive idea (poll/question sticker) + a link CTA." },
        carousel: { name: "Carousel", rule: "5–7 slides. Slide 1 = hook. Middle slides = one point each (short). Last slide = CTA. Give slide-by-slide text." },
        email: { name: "Email / newsletter", rule: "A subject line + a short scannable body + exactly one CTA." }
      };

      // ===== State =====
      let DATA = { brain: {}, ideas: [] };
      let FEED = null;
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const brain = (k) => (DATA.brain && DATA.brain[k] != null && DATA.brain[k] !== "") ? DATA.brain[k] : BRAND_SEED[k];
      let inflight = 0;
      function setSave(s) { $("saveState").className = "save-state " + s; $("saveState").textContent = s === "saving" ? "Saving…" : s === "saved" ? "Saved ✓" : s === "error" ? "Save failed" : ""; }
      async function api(method, path, body) {
        inflight++; setSave("saving");
        try {
          const r = await fetch("/api/marketing" + path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
          inflight--; setSave(r.ok ? (inflight ? "saving" : "saved") : "error");
          return r.ok ? r.json().catch(() => ({})) : null;
        } catch { inflight--; setSave("error"); return null; }
      }

      // ===== Auth =====
      async function checkAuth() { try { const r = await fetch("/api/marketing/me"); return r.ok; } catch { return false; } }
      async function boot() { if (await checkAuth()) return start(); $("gate").style.display = "block"; }
      $("g-btn").addEventListener("click", async () => {
        $("g-err").hidden = true;
        try {
          const r = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("g-email").value, password: $("g-pass").value }) });
          if (!r.ok) { const j = await r.json().catch(() => ({})); $("g-err").textContent = j.error || "Sign in failed."; $("g-err").hidden = false; return; }
          start();
        } catch { $("g-err").textContent = "Network error."; $("g-err").hidden = false; }
      });
      $("g-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("g-btn").click(); });

      let TAB = "radar";
      let RADAR = null; // { items, research, updatedAt } — this week's news, fetched once
      function mode() { try { return localStorage.getItem("mkt-mode") || "Marketer"; } catch { return "Marketer"; } }
      async function start() {
        $("gate").style.display = "none"; $("tabs").hidden = false; $("app").hidden = false;
        const d = await (await fetch("/api/marketing/data")).json().catch(() => ({}));
        DATA = { brain: d.brain || {}, ideas: Array.isArray(d.ideas) ? d.ideas : [] };
        setSave("saved");
        $("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { TAB = b.dataset.tab; $("tabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); render(); });
        // Produce modal close (wired once — the modal is static, not re-rendered).
        const closeProduce = () => { $("produce-modal").hidden = true; };
        $("produce-close").onclick = closeProduce;
        $("produce-modal").onclick = (e) => { if (e.target.id === "produce-modal") closeProduce(); };
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProduce(); });
        render();
        loadRadar();
      }
      async function loadRadar() {
        try { RADAR = await (await fetch("/api/marketing/radar")).json(); } catch { RADAR = { items: [], research: [] }; }
        if (TAB === "radar") render();
      }
      function render() {
        $("app").innerHTML = [panelRadar(), panelPlan(), panelCalendar(), panelCreate(), panelIdeas(), panelLibrary(), panelBrain()].join("");
        document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === "tab-" + TAB));
        wireRadar(); wirePlan(); wireCalendar(); wireCreate(); wireIdeas(); wireLibrary(); wireBrain();
      }

      // ===== RADAR / INTELLIGENCE =====
      // How each topic becomes a Universo content play (deterministic + brand-aware,
      // €0 — no AI needed to interpret; the optional prompt uses free AI).
      const TOPIC_PLAY = {
        Scholarships: { angle: "The scholarship most students miss — and how to find yours", platform: "reel", format: "Reel / carousel", formula: "scholarship", cta: "Scholarship", urgency: "This week", why: "Scholarship news is moving this week and funding is the #1 thing your audience is anxious about." },
        Cost: { angle: "What studying abroad actually costs — and how to cut it", platform: "reel", format: "Reel", formula: "pain", cta: "Discover", urgency: "This week", why: "Cost is in the news and it's the biggest fear for future students — be the honest source." },
        Visa: { angle: "Student-visa changes: what future students need to know", platform: "carousel", format: "Carousel / LinkedIn", formula: "advice", cta: "Sign up", urgency: "This week", why: "Visa/immigration news shifts fast and students panic — win trust by being calm and clear." },
        Applications: { angle: "Application deadlines are closer than you think — a simple plan", platform: "reel", format: "Reel / story", formula: "advice", cta: "Sign up", urgency: "This week", why: "Deadline season — high urgency and high search intent right now." },
        Erasmus: { angle: "Erasmus, explained for non-EU students", platform: "carousel", format: "Carousel", formula: "discovery", cta: "Scholarship", urgency: "Evergreen", why: "Erasmus gets attention but is widely misunderstood — a clear explainer earns saves." },
        Rankings: { angle: "Rankings ≠ the right fit. Here's what actually matters", platform: "linkedin", format: "LinkedIn / Reel", formula: "myth", cta: "Discover", urgency: "Evergreen", why: "Rankings get clicks but mislead students — a strong Universo contrarian angle." },
        "Study abroad": { angle: "Studying in Europe isn't just for rich kids — proof", platform: "reel", format: "Reel", formula: "myth", cta: "Discover", urgency: "This week", why: "Broad study-abroad conversation this week — join it with a myth-bust." },
      };
      // Creative content pillars — ANY kind of video, not filtered to university
      // topics. These give the suggestions breadth (relatable, motivational, POV,
      // lifestyle, career, behind-the-scenes, reaction, trend formats, wholesome)
      // so the feed is an average of everything, still in Universo's voice.
      const CREATIVE_PILLARS = [

        const sec = (title, list, empty, approve) => `<div class="card"><h2 style="margin-top:0">${title} <span class="pill">${list.length}</span></h2>${list.length ? list.map((i) => planRow(i, approve)).join("") : `<div class="muted">${empty}</div>`}</div>`;
        return `<section class="panel" id="tab-plan"><h1>Plan</h1><p class="sub">At-a-glance: what's due, what needs your sign-off, who owns what — so nobody asks "what should we do today?"</p>
          <div class="card" style="display:flex;gap:18px;flex-wrap:wrap"><div><b style="font-size:1.4rem">${active.length}</b><div class="muted">active items</div></div><div><b style="font-size:1.4rem">${mine.Marketer}</b><div class="muted">Marketer owns</div></div><div><b style="font-size:1.4rem">${mine.Founder}</b><div class="muted">Founder owns</div></div></div>
          ${sec("📅 Due this week", thisWeek, "Nothing scheduled — set a due date on an idea in the Ideas tab.")}
          ${sec("👀 Waiting for founder sign-off", review, "Nothing waiting on approval.", true)}
          ${sec("✍️ In progress", drafting, "Nothing being drafted right now.")}</section>`;
      }
      function wirePlan() {
        document.querySelectorAll("#tab-plan [data-approve]").forEach((b) => b.onclick = async () => {
          const id = b.dataset.approve, idea = DATA.ideas.find((x) => x.id === id); if (!idea) return;
          idea.status = "posted"; await api("PATCH", "/idea/" + id, { status: "posted" }); render();
        });
      }

      // ===== CALENDAR =====
      const CADENCE = { 1: "Educational / student problem", 2: "Trend — this week's news", 3: "Product / Universo value", 4: "Student story / relatable", 5: "Opinion / hot take", 6: "Community / repurpose", 0: "Plan & rest" };
      const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      function panelCalendar() {
        const start = new Date(); start.setHours(0, 0, 0, 0);
        const days = []; for (let i = 0; i < 14; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
        const iso = (d) => d.toISOString().slice(0, 10);
        const row = (d) => {
          const list = DATA.ideas.filter((x) => x.due === iso(d) && x.status !== "posted");
          const ideas = list.length ? list.map((x) => `<span class="pill ${x.owner === "Founder" ? "teal" : ""}">${esc(x.title.slice(0, 34))}</span>`).join(" ") : `<button class="link-mini" data-cal-add="${iso(d)}">＋ schedule an idea</button>`;
          return `<div class="cal-row"><div class="cal-day"><b>${WD[d.getDay()]}</b> ${iso(d).slice(5)}</div><div class="cal-body"><div class="cal-theme">${CADENCE[d.getDay()]}</div><div class="cal-ideas">${ideas}</div></div></div>`;
        };
        const wk = (a, b, label) => `<div class="card"><h2 style="margin-top:0">${label}</h2>${days.slice(a, b).map(row).join("")}</div>`;
        return `<section class="panel" id="tab-calendar"><h1>Content calendar</h1><p class="sub">A simple two-week schedule with a suggested weekly rhythm. Set a due date on any idea (Ideas tab, or "＋" below) and it lands here.</p>
          ${wk(0, 7, "This week")}${wk(7, 14, "Next week")}
          <div class="card muted">The themes are a starting rhythm, not a rule — mix in whatever <b>What's Happening</b> surfaces.</div></section>`;
      }
      function wireCalendar() {
        document.querySelectorAll("#tab-calendar [data-cal-add]").forEach((b) => b.onclick = async () => {
          const due = b.dataset.calAdd; const title = prompt("Idea to schedule for " + due + ":"); if (!title) return;
          const r = await api("POST", "/idea", { title: title.trim(), due, status: "drafting" });
          if (r && r.idea) { DATA.ideas.unshift(r.idea); render(); }
        });
      }

      // ===== CREATE =====
      function panelCreate() {
        return `<section class="panel" id="tab-create"><h1>Create</h1><p class="sub">One idea → a ready-to-post draft <b>and</b> a brand-aware prompt for any free AI (ChatGPT, Gemini, Claude, or local Ollama). Nothing is sent anywhere — you paste it yourself.</p>
          <div class="card">
            <div class="field"><label>The idea (one line)</label><input id="c-idea" placeholder="e.g. Why students miss scholarships they qualify for" /></div>
            <div class="field"><button class="btn alt sm" id="c-feed">💡 Need an idea? (your data + creative mix)</button><div id="c-feed-list" style="margin-top:10px"></div></div>
            <div class="row">
              <div class="field"><label>Formula</label><select id="c-formula">${FORMULAS.map((f) => `<option value="${f.id}">${f.name}</option>`).join("")}</select></div>
              <div class="field"><label>Goal / CTA</label><select id="c-cta">${Object.keys(CTAS).map((k) => `<option>${k}</option>`).join("")}</select></div>
            </div>
            <div class="field"><label>Platforms</label><div class="chips" id="c-plats">${Object.entries(PLATFORMS).map(([k, p], i) => `<button type="button" class="chip-btn${i < 3 ? " on" : ""}" data-plat="${k}" aria-pressed="${i < 3}">${p.name}</button>`).join("")}</div></div>
            <div class="row" style="margin-top:6px"><button class="btn gold" id="c-go" style="flex:0 0 auto">Generate content package</button><button class="btn alt" id="c-save" style="flex:0 0 auto">Save to Ideas</button></div>
          </div>
          <div id="c-out"></div></section>`;
      }
      function wireCreate() {
        const plats = document.querySelectorAll("#c-plats .chip-btn");
        plats.forEach((b) => b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); b.classList.toggle("on", on); });
        const feedBtn = $("c-feed");
        if (feedBtn) feedBtn.onclick = async () => {
          if (!FEED) { feedBtn.textContent = "Loading ideas…"; const r = await fetch("/api/marketing/ideas-feed"); FEED = (await r.json().catch(() => ({}))).seeds || []; feedBtn.textContent = "💡 Need an idea? (your data + creative mix)"; }
          const creativeSeeds = CREATIVE_PILLARS.map((p) => ({ cat: p.topic, text: p.angle }));
          const combined = shuffle([...(FEED || []), ...creativeSeeds]).slice(0, 30);
          $("c-feed-list").innerHTML = combined.map((s) => `<button type="button" class="seed" data-seed="${esc(s.text)}"><span class="pill teal">${esc(s.cat)}</span>${esc(s.text)}</button>`).join("");
          document.querySelectorAll("#c-feed-list .seed").forEach((b) => b.onclick = () => { $("c-idea").value = b.dataset.seed; $("c-feed-list").innerHTML = ""; $("c-idea").scrollIntoView({ block: "center" }); });
        };
        $("c-go").onclick = () => {
          const idea = $("c-idea").value.trim(); if (!idea) { alert("Type the idea first."); return; }
          const formula = FORMULAS.find((f) => f.id === $("c-formula").value);
          const cta = CTAS[$("c-cta").value];
          const chosen = [...plats].filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.dataset.plat);
          if (!chosen.length) { alert("Pick at least one platform."); return; }
          $("c-out").innerHTML = chosen.map((p) => outputBlock(p, idea, formula, cta)).join("");
          document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText($(b.dataset.copy).textContent); const t = b.textContent; b.textContent = "Copied ✓"; setTimeout(() => b.textContent = t, 1200); } catch { alert("Copy failed — select the text manually."); } });
        };
        $("c-save").onclick = async () => { const v = $("c-idea").value.trim(); if (!v) return; const r = await api("POST", "/idea", { title: v, formula: $("c-formula").value, status: "drafting" }); if (r && r.idea) { DATA.ideas.unshift(r.idea); alert("Saved to the Ideas tab (Drafting)."); } };
      }
      function brandBlock() {
        return `You are writing for Universo, a student platform. Mission: ${brain("mission")}
What Universo is: ${brain("product")}
Audience: ${brain("audience")}
Their pains:\n${brain("pains")}
Tone: ${brain("tone")}
Hard rules — never break these: ${brain("donot")}
Approved facts (only state what's here, never invent numbers): ${brain("facts")}`;
      }
      function buildPrompt(pk, idea, formula, cta) {
        const p = PLATFORMS[pk];
        return `${brandBlock()}

TASK: Write a ${p.name} about this idea:
"${idea}"

Use this proven structure (adapt naturally, don't label the steps):
${formula.steps.map((s, i) => `${i + 1}. ${s}`).join("\n")}

Platform rules: ${p.rule}
End with this call to action (rephrase in Universo's voice): "${cta}"

Style: sound like a real, warm human on the student's side — not a brand or an AI. No clichés, no "in today's fast-paced world", no emoji spam. Be specific and useful.

Output ONLY the finished ${p.name}, ready to post.`;
      }
      function buildSkeleton(pk, idea, formula, cta) {
        const p = PLATFORMS[pk];
        return `[${p.name}] — skeleton for: ${idea}\n\n` + formula.steps.map((s) => `• ${s}:\n   …`).join("\n") + `\n• CTA: ${cta}\n\n(Platform note: ${p.rule})`;
      }
      function outputBlock(pk, idea, formula, cta) {
        const p = PLATFORMS[pk], pid = "p_" + pk, sid = "s_" + pk;
        return `<div class="out-block"><div class="out-head"><b>${p.name}</b></div>
          <div class="out-head" style="background:var(--surface)"><span class="tag prompt">Prompt for free AI</span><button class="btn sm" data-copy="${pid}">Copy prompt</button></div><pre id="${pid}">${esc(buildPrompt(pk, idea, formula, cta))}</pre>
          <div class="out-head" style="background:var(--surface)"><span class="tag draft">Manual skeleton</span><button class="btn sm alt" data-copy="${sid}">Copy skeleton</button></div><pre id="${sid}">${esc(buildSkeleton(pk, idea, formula, cta))}</pre></div>`;
      }

      // ===== IDEAS =====
      function panelIdeas() {
        const list = DATA.ideas;
        return `<section class="panel" id="tab-ideas"><h1>Ideas</h1><p class="sub">Saved ideas and finished drafts. Status: idea → drafting → posted. Paste the AI's final output into "Final draft" so nothing gets lost.</p>
          <div class="card"><div class="row"><input id="i-title" placeholder="New idea (one line)" /><select id="i-owner" style="flex:0 0 120px">${OWNERS.map((o) => `<option>${o}</option>`).join("")}</select><button class="btn" id="i-add" style="flex:0 0 auto">Add</button></div></div>
          ${list.length ? list.map(ideaItem).join("") : '<div class="card muted">No saved ideas yet. Add one above, or save one from the Create tab.</div>'}</section>`;
      }
      function ideaItem(i) {
        const fname = (FORMULAS.find((f) => f.id === i.formula) || {}).name;
        return `<div class="idea-item" data-id="${i.id}"><div class="top"><b>${esc(i.title)}</b>
          <select data-act="status" title="Status">${STATUSES.map((s) => `<option${(i.status || "idea") === s ? " selected" : ""}>${s}</option>`).join("")}</select>
          <button class="chip-btn" data-act="produce" title="Produce (shoot-ready brief)">🎬</button>
          <button class="chip-btn" data-act="del" title="Delete">🗑</button></div>
          <div class="top" style="margin-top:8px">
            <select data-act="owner" title="Owner" style="flex:0 0 auto">${OWNERS.map((o) => `<option${(i.owner || "Marketer") === o ? " selected" : ""}>${o}</option>`).join("")}</select>
            <label style="flex:0 0 auto;margin:0;display:flex;align-items:center;gap:6px;text-transform:none;font-size:.8rem;color:var(--soft)">Due <input type="date" data-act="due" value="${esc(i.due || "")}" style="min-height:40px;width:auto" /></label>
            ${fname ? `<span class="pill">${esc(fname)}</span>` : ""}</div>
          <div style="margin-top:8px"><label>Final draft (paste the AI's output here)</label><textarea data-act="draft" rows="2" placeholder="…">${esc(i.draft || "")}</textarea></div></div>`;
      }
      function wireIdeas() {
        const add = $("i-add");
        if (add) add.onclick = async () => { const v = $("i-title").value.trim(); if (!v) return; const r = await api("POST", "/idea", { title: v, owner: $("i-owner").value }); if (r && r.idea) { DATA.ideas.unshift(r.idea); $("i-title").value = ""; render(); } };
        document.querySelectorAll("#tab-ideas .idea-item").forEach((el) => {
          const id = el.dataset.id, idea = DATA.ideas.find((x) => x.id === id); if (!idea) return;
          el.querySelector('[data-act="status"]').onchange = (e) => { idea.status = e.target.value; api("PATCH", "/idea/" + id, { status: e.target.value }); };
          el.querySelector('[data-act="owner"]').onchange = (e) => { idea.owner = e.target.value; api("PATCH", "/idea/" + id, { owner: e.target.value }); };
          el.querySelector('[data-act="due"]').onchange = (e) => { idea.due = e.target.value; api("PATCH", "/idea/" + id, { due: e.target.value }); };
          el.querySelector('[data-act="produce"]').onclick = () => openProduce(ideaToOpp(idea));
          el.querySelector('[data-act="del"]').onclick = async () => { if (!confirm("Delete this idea?")) return; await api("DELETE", "/idea/" + id); DATA.ideas = DATA.ideas.filter((x) => x.id !== id); render(); };
          let t; el.querySelector('[data-act="draft"]').oninput = (e) => { idea.draft = e.target.value; clearTimeout(t); t = setTimeout(() => api("PATCH", "/idea/" + id, { draft: e.target.value }), 600); };
        });
      }

      // ===== LIBRARY =====
      function panelLibrary() {
        return `<section class="panel" id="tab-library"><h1>Library</h1><p class="sub">Reusable building blocks + the anti-repetition angle picker (tap to grey out angles you've used on a topic).</p>
          <div class="card"><h2 style="margin-top:0">🎬 Content formats — any kind of video</h2><p class="muted">Not just university topics — relatable, motivation, POV, lifestyle, career, reaction, trend formats. Tap "Use" to start one in Create.</p>${CREATIVE_PILLARS.map((p, i) => `<div class="head-item"><b>${esc(p.angle)}</b> <span class="pill">${esc(p.topic)}</span><div class="head-meta">${esc(p.format)} · <button class="link-mini" data-pillar="${i}">Use →</button></div></div>`).join("")}</div>
          <div class="card"><h2 style="margin-top:0">Angle picker</h2><div class="chips" id="lib-angles">${ANGLES.map((a) => `<button class="chip-btn" data-angle>${esc(a)}</button>`).join("")}</div></div>
          <div class="card"><h2 style="margin-top:0">Hook bank</h2>${HOOKS.map((h) => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><button class="btn sm alt" data-hook="${esc(h)}" style="margin-right:8px">Copy</button>${esc(h)}</div>`).join("")}</div>
          <div class="card"><h2 style="margin-top:0">Formulas</h2>${FORMULAS.map((f) => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${f.name}</b><div class="muted">${f.steps.join(" → ")}</div></div>`).join("")}</div>
          <div class="card"><h2 style="margin-top:0">CTAs</h2>${Object.entries(CTAS).map(([k, v]) => `<div style="padding:6px 0"><span class="pill">${k}</span> ${esc(v)}</div>`).join("")}</div></section>`;
      }
      function wireLibrary() {
        document.querySelectorAll("#tab-library [data-angle]").forEach((b) => b.onclick = () => b.classList.toggle("used"));
        document.querySelectorAll("#tab-library [data-hook]").forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.hook); const x = b.textContent; b.textContent = "Copied"; setTimeout(() => b.textContent = x, 1000); } catch {} });
        document.querySelectorAll("#tab-library [data-pillar]").forEach((b) => b.onclick = () => {
          const p = CREATIVE_PILLARS[+b.dataset.pillar]; if (!p) return;
          TAB = "create"; $("tabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.tab === "create")); render();
          setTimeout(() => { const el = $("c-idea"); if (el) { el.value = p.angle; const fs = $("c-formula"); if (fs) fs.value = p.formula; el.scrollIntoView({ block: "center" }); } }, 60);
        });
      }

      // ===== BRAND BRAIN =====
      const BRAIN_FIELDS = [["mission", "Mission"], ["product", "What Universo is"], ["audience", "Audience"], ["pains", "Student pains"], ["tone", "Tone of voice"], ["donot", "Hard rules (never do)"], ["facts", "Approved facts / numbers"], ["faqs", "FAQs"]];
      function panelBrain() {
        return `<section class="panel" id="tab-brain"><h1>Brand Brain</h1><p class="sub">Universo's messaging — written once, injected into every prompt so you never re-explain the product. Edit to refine; blank = the seeded default.</p>
          ${BRAIN_FIELDS.map(([k, l]) => `<div class="card"><label>${l}</label><textarea data-brain="${k}" rows="${["product", "pains", "faqs"].includes(k) ? 5 : 3}">${esc(brain(k))}</textarea></div>`).join("")}</section>`;
      }
      function wireBrain() {
        document.querySelectorAll("[data-brain]").forEach((t) => { let tm; t.oninput = () => { DATA.brain[t.dataset.brain] = t.value; clearTimeout(tm); tm = setTimeout(() => api("PATCH", "/brain", { [t.dataset.brain]: t.value }), 600); }; });
      }

      boot();
    </script>
  </body>
</html>
