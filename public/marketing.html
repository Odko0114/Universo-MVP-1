<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Universo — Marketing OS</title>
    <link rel="icon" href="/favicon.svg?v=3" />
    <style>
      :root {
        --bg: #f5f7fb; --surface: #ffffff; --surface-2: #eef1f6;
        --ink: #10233f; --soft: #45566e; --faint: #6b7688; --line: #e1e6ee;
        --navy: #0b1f3a; --teal: #0d9488; --teal-bg: #e6f7f4; --gold: #e9b949;
        --danger: #d64550; --radius: 14px;
        --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      :root[data-theme="dark"] {
        --bg: #1c1b1a; --surface: #292826; --surface-2: #201e1c;
        --ink: #eeede9; --soft: #bebbb4; --faint: #949089; --line: rgba(255,255,255,0.11);
        --navy: #242322; --teal: #46cdb6; --teal-bg: rgba(70,205,182,0.12); --gold: #f2be5b;
        --danger: #ec6f79; color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
      a { color: var(--teal); }
      button { font-family: inherit; }
      header { background: var(--navy); color: #fff; padding: 14px 18px; position: sticky; top: 0; z-index: 20; }
      .head-in { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: #fff; }
      .brand svg { width: 26px; height: 26px; color: #fff; }
      .brand b { font-weight: 800; font-style: italic; letter-spacing: -0.01em; }
      .brand small { color: var(--gold); font-size: 0.72rem; font-weight: 700; }
      .save-state { margin-left: auto; font-size: 0.8rem; color: #cdd7e6; }
      .save-state.saving { color: var(--gold); }
      .save-state.saved { color: #7fe0cf; }
      .save-state.error { color: #ffb0b0; }
      .tabs { max-width: 900px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; }
      .tabs button { border: 0; background: rgba(255,255,255,0.08); color: #dfe6f2; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor: pointer; min-height: 40px; }
      .tabs button.on { background: var(--gold); color: var(--navy); }
      main { max-width: 900px; margin: 0 auto; padding: 18px; }
      .panel { display: none; } .panel.on { display: block; }
      h1 { font-size: 1.35rem; margin: 4px 0; }
      h2 { font-size: 1.02rem; margin: 20px 0 10px; }
      .sub { color: var(--soft); font-size: 0.9rem; margin: 0 0 14px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
      label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--soft); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 5px; }
      input, select, textarea { width: 100%; font-family: inherit; font-size: 0.95rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); min-height: 44px; }
      textarea { resize: vertical; min-height: 80px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1; min-width: 140px; }
      .field { margin-bottom: 12px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 11px 16px; min-height: 44px; font-weight: 700; font-size: 0.9rem; cursor: pointer; background: var(--teal); color: #fff; }
      .btn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
      .btn.gold { background: var(--gold); color: var(--navy); }
      .btn.sm { padding: 7px 11px; min-height: 36px; font-size: 0.82rem; }
      .muted { color: var(--faint); font-size: 0.85rem; }
      .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; background: var(--surface-2); color: var(--soft); }
      .pill.teal { background: var(--teal-bg); color: var(--teal); }
      .pill.overdue { background: rgba(214,69,80,0.15); color: var(--danger); }
      .pill.soon { background: rgba(233,185,73,0.18); color: #916609; }
      :root[data-theme="dark"] .pill.soon { color: var(--gold); }
      /* Radar / intelligence */
      .radar-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .radar-top h1 { margin: 4px 0; }
      .mode-toggle { margin-left: auto; display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
      .mode-toggle .chip-btn { border: 0; min-height: 34px; padding: 6px 12px; }
      .mode-toggle .chip-btn.on { background: var(--teal); color: #fff; }
      .action { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer; font-size: 0.92rem; font-weight: 600; }
      .action:hover { border-color: var(--teal); }
      .warn { background: rgba(233,185,73,0.12); border-color: rgba(233,185,73,0.4); }
      .opp { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--surface); }
      .opp-head { display: flex; gap: 8px; margin-bottom: 8px; }
      .opp-angle { font-weight: 800; font-size: 1.02rem; margin-bottom: 6px; }
      .opp-why { font-size: 0.88rem; color: var(--soft); margin-bottom: 8px; }
      .opp-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: var(--soft); margin-bottom: 6px; }
      .opp-hooks { font-size: 0.86rem; margin-bottom: 6px; } .opp-hooks ul { margin: 4px 0 0; padding-left: 18px; } .opp-hooks li { margin: 2px 0; }
      .opp-src { font-size: 0.82rem; color: var(--faint); margin-bottom: 10px; }
      .opp-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .opp-prompt { margin: 10px 0 0; padding: 11px; white-space: pre-wrap; word-wrap: break-word; font-size: 0.82rem; background: var(--surface-2); border-radius: 8px; }
      .head-item { padding: 8px 0; border-bottom: 1px solid var(--line); }
      .head-item:last-child { border-bottom: 0; }
      .head-title { display: inline-block; font-weight: 600; font-size: 0.9rem; }
      .head-meta { font-size: 0.78rem; color: var(--faint); margin-top: 3px; }
      .link-mini { border: 0; background: none; color: var(--teal); font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; padding: 0; }
      .cal-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .cal-row:last-child { border-bottom: 0; }
      .cal-day { flex: 0 0 78px; font-size: 0.86rem; }
      .cal-body { flex: 1; min-width: 0; }
      .cal-theme { font-size: 0.82rem; color: var(--soft); font-weight: 600; }
      .cal-ideas { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
      .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
      .modal[hidden] { display: none; } /* the class's display:flex overrides the UA [hidden] rule, so hide it explicitly */
      .modal-in { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; max-width: 620px; width: 100%; padding: 22px; position: relative; margin: auto; }
      .modal-x { position: absolute; top: 12px; right: 14px; border: 0; background: var(--surface-2); color: var(--ink); width: 34px; height: 34px; border-radius: 999px; font-size: 1.2rem; cursor: pointer; }
      .prod-sec { border-top: 1px solid var(--line); padding: 12px 0; }
      .prod-h { font-size: 0.76rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--soft); margin-bottom: 6px; }
      .prod-shots { margin: 4px 0; padding-left: 20px; } .prod-shots li { margin: 3px 0; }
      #prod-cap { margin: 0; padding: 10px; white-space: pre-wrap; font-size: 0.86rem; background: var(--surface-2); border-radius: 8px; }
      .prod-check { display: flex; align-items: center; gap: 8px; text-transform: none; font-size: 0.9rem; color: var(--ink); font-weight: 500; margin: 4px 0; }
      .prod-check input { width: auto; min-height: auto; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip-btn { border: 1px solid var(--line); background: var(--surface); color: var(--soft); border-radius: 999px; padding: 8px 12px; font-size: 0.82rem; cursor: pointer; min-height: 40px; }
      .chip-btn.on { border-color: var(--teal); color: var(--teal); font-weight: 700; }
      .chip-btn.used { color: var(--faint); text-decoration: line-through; }
      .out-block { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
      .out-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surface-2); flex-wrap: wrap; }
      .out-head b { font-size: 0.9rem; }
      .out-head .btn { margin-left: auto; }
      .out-block pre { margin: 0; padding: 12px; white-space: pre-wrap; word-wrap: break-word; font-family: inherit; font-size: 0.88rem; color: var(--ink); background: var(--surface); }
      .tag { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 800; color: #fff; padding: 2px 7px; border-radius: 5px; }
      .tag.prompt { background: var(--teal); } .tag.draft { background: var(--gold); color: var(--navy); }
      .seed { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; cursor: pointer; font-size: 0.88rem; }
      .seed:hover { border-color: var(--teal); }
      .seed .pill { margin-right: 7px; }
      .idea-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
      .idea-item .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .idea-item b { flex: 1; min-width: 160px; }
      .idea-item select { flex: 0 0 auto; width: auto; min-height: 40px; padding: 6px 10px; }
      /* Content performance feedback loop */
      .res-row { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
      .res-row .row { margin-bottom: 8px; }
      .res-row .field { margin-bottom: 8px; }
      .res-remove { border: 0; background: none; color: var(--danger); font: inherit; font-weight: 700; cursor: pointer; padding: 4px; }
      .res-metrics { display: flex; gap: 8px; flex-wrap: wrap; }
      .res-metrics .field { flex: 1; min-width: 84px; margin: 0; }
      .res-metrics label { font-size: 0.68rem; }
      .res-metrics input { min-height: 40px; padding: 8px 10px; }
      .res-note-tiny { font-size: 0.78rem; color: var(--faint); margin: 2px 0 12px; }
      .posted-box { margin-top: 10px; padding: 11px 13px; border-radius: 10px; background: var(--teal-bg); border: 1px solid var(--line); }
      .posted-box + .posted-box { margin-top: 6px; }
      .posted-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.9rem; }
      .posted-head b { flex: 0 0 auto; min-width: 0; }
      .posted-note { font-size: 0.86rem; color: var(--soft); margin: 5px 0 0; }
      .posted-metrics { font-size: 0.82rem; color: var(--soft); margin-top: 5px; }
      .posted-metrics .mtag { color: var(--faint); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .rating { font-weight: 800; }
      .rating.Great { color: var(--teal); } .rating.Good { color: var(--teal); } .rating.Average { color: var(--soft); } .rating.Poor { color: var(--danger); }
      .perf-grid { display: flex; gap: 16px; flex-wrap: wrap; }
      .perf-grid > div { min-width: 70px; } .perf-grid b { font-size: 1.35rem; display: block; }
      .work-list { margin: 6px 0 0; padding-left: 18px; } .work-list li { margin: 3px 0; font-size: 0.9rem; }
      #gate { max-width: 380px; margin: 12vh auto; }
      @media (max-width: 560px) { main { padding: 14px; } .out-head .btn { margin-left: 0; } .btn.sm, .chip-btn { min-height: 40px; } .opp-actions .btn { flex: 1; } }
    </style>
  </head>
  <body>
    <header>
      <div class="head-in">
        <a class="brand" href="/admin"><!--BRAND_MARK--><span style="display:flex;flex-direction:column;line-height:1"><b>Universo</b><small>MARKETING OS</small></span></a>
        <div class="save-state" id="saveState"></div>
      </div>
      <nav class="tabs" id="tabs" hidden>
        <button data-tab="home" class="on">🏠 Home</button>
        <button data-tab="ideas">📥 Content</button>
        <button data-tab="calendar">🗓️ Calendar</button>
        <button data-tab="campaigns">🎯 Campaigns</button>
        <button data-tab="brain">✦ Brand</button>
        <button data-tab="analytics">📊 Analytics</button>
        <button data-tab="team" hidden>👥 Team</button>
      </nav>
    </header>

    <main>
      <div class="card" id="gate">
        <h1>Marketing OS</h1>
        <p class="sub">Sign in with your Universo account.</p>
        <div class="field"><label>Email</label><input id="g-email" type="email" autocomplete="username" /></div>
        <div class="field"><label>Password</label><input id="g-pass" type="password" autocomplete="current-password" /></div>
        <div id="g-err" class="muted" style="color:var(--danger);margin-bottom:10px" hidden></div>
        <button class="btn" id="g-btn" style="width:100%">Sign in</button>
      </div>
      <div id="app" hidden></div>
    </main>

    <div id="produce-modal" class="modal" hidden><div class="modal-in"><button class="modal-x" id="produce-close" aria-label="Close">×</button><div id="produce-body"></div></div></div>
    <div id="results-modal" class="modal" hidden><div class="modal-in"><button class="modal-x" id="results-close" aria-label="Close">×</button><div id="results-body"></div></div></div>
    <div id="editor-modal" class="modal" hidden><div class="modal-in" style="max-width:720px"><button class="modal-x" id="editor-close" aria-label="Close">×</button><div id="editor-body"></div></div></div>
    <div id="imgedit-modal" class="modal" hidden><div class="modal-in" style="max-width:640px"><button class="modal-x" id="imgedit-close" aria-label="Close">×</button><div id="imgedit-body"></div></div></div>

    <script>
      // ===== Library (version-controlled) =====
      const BRAND_SEED = {
        mission: "Where you're born shouldn't determine how you begin. Universo helps future students discover European universities and the scholarships that can fund them — free, honest, no invented data.",
        product: "Discover 2,899 universities across 32 European countries (from the EU's official register, ETER), 300 hand-verified in depth. Match to what fits you, see real government scholarships you can actually use, compare side by side, and build a free Dream Plan to save, plan and track applications & deadlines. Free forever — funded by universities, not students.",
        audience: "Future/international students (esp. from Mongolia and other non-EU countries) who want to study in Europe — plus their parents. Mostly on phones, high intent, anxious about cost, eligibility and the process.",
        pains: "• Don't know where they can actually afford to study\n• Scholarships are scattered and confusing\n• Fear of hidden costs\n• Overwhelmed by requirements and deadlines\n• Agents overcharge\n• Language-requirement confusion\n• \"Is my degree even eligible?\"",
        tone: "Honest, warm, clear, encouraging. Plain language, no hype, no jargon. \"Same Start. Equal Chance.\" Never overstate traction; every number traceable to a source.",
        donot: "Never invent tuition, eligibility, deadlines or scholarship figures. Never overstate how many people use it. Don't sound like a generic AI or a pushy agent.",
        facts: "2,899 universities · 32 European countries · 300 hand-verified profiles · sourced from the EU register (ETER) · free forever",
        faqs: "• Is it free? Yes — funded by universities, not students.\n• Is the data accurate? Every uni is from the EU register; 300 are hand-verified.\n• Do I need an account? No to browse; an account lets you save & plan.\n• How is it different from Googling? It matches unis to you, tells you why, and puts real tuition/deadlines/language side by side.\n• Which countries? 32 across Europe.",
        // Goals & positioning. Qualitative seeds only — NEVER seed invented traction/users/revenue.
        goal_audience: "Grow a trusted international-student following; build a genuine community; earn saves/comments/shares by being useful, not clickbait; build credibility through sourced, honest information.",
        biz_goals: "Attract universities and generate qualified university leads; build partnerships; show real product progress; attract mission-aligned investors; communicate the market opportunity and milestones honestly.",
        inv_problem: "Where you're born still shapes access to higher education. Discovering European universities and the scholarships that fund them is scattered, confusing, often in the wrong language, and gate-kept by paid agents.",
        inv_why: "Many capable students never apply because the information is fragmented, hidden behind cost/misinformation, or hard to trust.",
        inv_diff: "Free, honest, no invented data: matches students to fit, surfaces real government scholarships, sourced from the EU register (ETER). Funded by universities, not students.",
        inv_model: "Free for students; universities pay to reach students who genuinely fit.",
        inv_vision: "Same Start. Equal Chance. — the trusted front door to studying in Europe for every student, wherever they're born.",
        traction: "", // real, verifiable only — leave blank until there's something true to say
        milestones: "",
        inv_market: "",
        inv_want: "",
      };
      const FORMULAS = [
        { id: "howto", name: "How-To", desc: "Teach someone how to do something", steps: ["Hook (the promise)", "Why it matters", "Step 1", "Step 2", "Step 3", "CTA"] },
        { id: "list", name: "List", desc: "Give 3–7 useful points", steps: ["Hook (number + promise)", "Point 1", "Point 2", "Point 3", "The best one", "CTA"] },
        { id: "problem_solution", name: "Problem → Solution", desc: "Show a problem and solve it", steps: ["The problem", "Why it happens", "The solution", "How Universo helps", "CTA"] },
        { id: "myth_fact", name: "Myth vs Fact", desc: "Correct a common misunderstanding", steps: ["The myth", "Why people believe it", "The fact (with source)", "What to do instead", "CTA"] },
        { id: "before_after", name: "Before → After", desc: "Show a change or transformation", steps: ["The before", "The turning point", "The after", "How to get there", "CTA"] },
        { id: "story", name: "Story", desc: "Tell a short real story", steps: ["Set the scene", "What happened", "The turning point", "The lesson", "CTA"] },
        { id: "pov", name: "POV", desc: "Put the viewer inside a situation", steps: ["Set the POV", "The moment", "The realization", "CTA"] },
        { id: "question", name: "Question", desc: "Start with a question the audience cares about", steps: ["Open with the question", "Why it matters", "The answer", "CTA"] },
        { id: "hottake", name: "Hot Take", desc: "Challenge a common opinion", steps: ["The bold claim", "Why everyone's wrong", "The real point", "CTA"] },
        { id: "mistake", name: "Mistake", desc: "Show a mistake and how to avoid it", steps: ["The mistake", "Why it hurts", "The fix", "CTA"] },
        { id: "proof", name: "Proof / Results", desc: "Show real evidence or results", steps: ["The claim", "The evidence", "What it means for you", "CTA"] },
        { id: "comparison", name: "Comparison", desc: "Compare two choices", steps: ["Option A", "Option B", "The honest trade-off", "Which fits whom", "CTA"] },
        { id: "reaction", name: "Reaction / Commentary", desc: "React to relevant news or trends", steps: ["The news / trend", "Your take", "Why students should care", "CTA"] },
        { id: "bts", name: "Behind the Scenes", desc: "Show how something works", steps: ["What you're showing", "How it works", "Why it matters", "CTA"] },
        { id: "student_story", name: "Student Story", desc: "A relatable student experience", steps: ["Meet the student", "Their struggle", "What changed", "How Universo helped", "CTA"] },
        { id: "founder_story", name: "Founder Story", desc: "The people/building journey behind Universo", steps: ["The observation", "The personal why", "What we're building", "The mission", "CTA"] },
        { id: "creative", name: "Creative / Experimental", desc: "Unusual concepts, visual storytelling, humor", steps: ["The concept", "The twist", "The pay-off", "CTA"] },
      ];
      // Old formula ids still referenced by opportunity cards / Produce — map to the new set.
      const FORMULA_ALIAS = { pain: "problem_solution", discovery: "student_story", advice: "howto", founder: "founder_story", feature: "problem_solution", myth: "myth_fact", scholarship: "proof" };
      const getFormula = (id) => FORMULAS.find((f) => f.id === id) || FORMULAS.find((f) => f.id === FORMULA_ALIAS[id]) || FORMULAS[0];
      const HOOKS = [
        "Most students think {X}. Here's what actually happens.", "You can study in {country} for €0. Here's how.", "The scholarship nobody tells you about.", "I checked 2,899 universities so you don't have to.", "Applying abroad? Avoid this €{X} mistake.", "POV: you just found out {country} has free tuition.", "3 scholarships for {country} students closing soon.", "Your dream university might be cheaper than you think.", "Nobody explains this about studying abroad.", "Stop paying an agent €{X}. Do this instead.", "Studying in Europe isn't just for rich kids. Proof:", "Save this before you apply anywhere."
      ];
      const CTAS = { Discover: "Find your matches free on Universo — link in bio.", Save: "Save your shortlist so you never lose it.", "Sign up": "Build your free Dream Plan in 20 seconds.", Scholarship: "See which scholarships you can actually use — free." };
      const ANGLES = ["Tuition cost", "Hidden costs", "Scholarships", "Budgeting", "Application mistakes", "Country comparison", "A student's story", "Myth-busting", "Deadlines & timeline", "Eligibility", "Language requirements", "Parents' perspective"];
      // Hook PATTERNS (reusable structures, not fill-in example hooks) — the
      // structure is ethos-neutral; the honesty rule is that you only ever fill
      // them with real, sourced facts. Never invent a number to fit a pattern.
      const HOOK_FORMULAS = [
        { name: "Observation + stat + contrast", pattern: "I've been watching {trend}. {A real, sourced number}. Most people think {X} — but actually {Y}. Here's what to do.", eg: "Studying in Europe keeps trending. 32 countries, many with €0 tuition. Most think it's only for rich kids — it isn't. Here's how to find yours." },
        { name: "Personal limitation → result", pattern: "I couldn't {thing}. But {timeframe} I {a surprising, true result}.", eg: "I thought I couldn't afford to study abroad. Last month I found 3 scholarships I actually qualify for." },
        { name: "Social proof (real numbers only)", pattern: "I {looked at / talked to} {a real number} {group}. {An honest, surprising finding}.", eg: "We checked 2,899 European universities. Hundreds cost far less than students expect." },
        { name: "Contrarian challenge", pattern: "Everyone says {common advice}. That's surface-level. What actually matters is {the real point}.", eg: "Everyone says 'pick the highest-ranked university.' That's surface-level. What matters is fit, cost, and whether you'll get in." },
        { name: "Simple declarative", pattern: "{One bold, true statement that frames the whole piece}.", eg: "Where you're born shouldn't decide where you study." },
        { name: "Harsh truth", pattern: "Harsh truth: {an uncomfortable but honest reality}.", eg: "Harsh truth: most students never check if they qualify for scholarships they'd actually get." },
      ];
      // Content principles — the honesty-aligned "non-negotiables" worth keeping
      // in front of a 2-person team before they write anything.
      const CONTENT_PRINCIPLES = [
        "Decide the angle first: who is this for, and what's the one takeaway?",
        "Start from something real — a fact, a scholarship, a student's situation — not a generic template.",

      // Upload an image blob to the OS asset store (€0, on the persistent disk).

        $("imgedit-modal").hidden = false;
        const cv = $("ie-canvas"), ctx = cv.getContext("2d"); const img = blank ? null : new Image(); let ready = blank;
        const wrap = (text, maxW) => { const words = text.split(/\s+/), lines = []; let line = ""; for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; } if (line) lines.push(line); return lines; };
        const fillBg = () => { if (bg.grad) { const g = ctx.createLinearGradient(0, 0, cv.width, cv.height); g.addColorStop(0, bg.grad[0]); g.addColorStop(1, bg.grad[1]); ctx.fillStyle = g; } else ctx.fillStyle = bg.css; ctx.fillRect(0, 0, cv.width, cv.height); };
        const draw = () => {

          ctx.textAlign = "center"; ctx.textBaseline = "middle";

          for (let guard = 0; guard < 40; guard++) { ctx.font = `800 ${size}px ${ff}`; lines = wrap(text, cv.width * 0.86); lh = size * 1.2; blockH = lines.length * lh; if (blockH <= cv.height * 0.86 || size <= 18) break; size *= 0.92; } // auto-fit — no manual fiddling
          const pos = $("ie-pos").value, cy = pos === "top" ? blockH / 2 + cv.height * 0.06 : pos === "middle" ? cv.height / 2 : cv.height - blockH / 2 - cv.height * 0.06;

        if (blank) { setSize("Square"); } else { img.crossOrigin = "anonymous"; img.onload = () => { const sc = Math.min(1, 1080 / Math.max(img.naturalWidth, img.naturalHeight)); cv.width = Math.round(img.naturalWidth * sc) || 640; cv.height = Math.round(img.naturalHeight * sc) || 640; ready = true; draw(); }; img.onerror = () => { $("ie-err").textContent = "Couldn't load that image."; }; img.src = url; }

          $("ie-bgcustom").oninput = () => { document.querySelectorAll("#ie-bgs .chip-btn").forEach((x) => x.classList.remove("on")); bg = { css: $("ie-bgcustom").value }; draw(); };

      }
      // Fetch and render the deterministic real-data script into the Produce modal.
      let PROD_SCRIPT = "";
      function scriptToText(data) {
        const lines = data.beats.map((b) => `[${b.cue}] ${b.line}`).join("\n");

      }

        try { const q = new URLSearchParams({ topic: o.topic || "", formula: o.formula || "", angle: o.angle || "", platform: o.platform || "", cta: CTAS[o.cta] || "", help: brandHelp() }); data = await (await fetch("/api/marketing/script?" + q)).json(); } catch {}

      // Shared idea constants (used by the Board cards). Plan was folded into the Board.

        const winners = entries.filter(({ r }) => r.rating === "Great" || r.rating === "Good").sort((a, b) => (b.r.date || "").localeCompare(a.r.date || "")).slice(0, 5);

          <div class="top" style="margin-top:8px">
            <select data-act="owner" title="Owner" style="flex:0 0 auto">${OWNERS.map((o) => `<option${(i.owner || "Marketer") === o ? " selected" : ""}>${o}</option>`).join("")}</select>
            <label style="flex:0 0 auto;margin:0;display:flex;align-items:center;gap:6px;text-transform:none;font-size:.8rem;color:var(--soft)">Due <input type="date" data-act="due" value="${esc(i.due || "")}" style="min-height:40px;width:auto" /></label>
            <label style="flex:0 0 auto;margin:0;display:flex;align-items:center;gap:6px;text-transform:none;font-size:.8rem;color:var(--soft)"><input type="checkbox" data-act="approval"${i.approval ? " checked" : ""}${(!isFounder() && i.approval) ? " disabled" : ""} style="width:auto;min-height:auto" /> ⚑ Needs approval</label>
            ${fname ? `<span class="pill">${esc(fname)}</span>` : ""}${tags}</div>
          <div style="margin-top:8px"><label>Final draft (paste the AI's output here)</label><textarea data-act="draft" rows="2" placeholder="…">${esc(i.draft || "")}</textarea></div>
          ${postedSummary(i)}</div>`;
      }
      // Per-card handlers. `rerender` re-lays the lanes (so a status change moves
      // the card to its new lane) without a full render that would clear filters.
      function wireCards(rerender) {
        document.querySelectorAll("#tab-ideas .idea-item").forEach((el) => {
          const id = el.dataset.id, idea = DATA.ideas.find((x) => x.id === id); if (!idea) return;
          el.querySelector('[data-act="status"]').onchange = async (e) => { idea.status = e.target.value; await api("PATCH", "/idea/" + id, { status: e.target.value }); rerender(); if (e.target.value === "posted") openResults(idea); };
          el.querySelector('[data-act="owner"]').onchange = (e) => { idea.owner = e.target.value; api("PATCH", "/idea/" + id, { owner: e.target.value }); };
          el.querySelector('[data-act="due"]').onchange = (e) => { idea.due = e.target.value; api("PATCH", "/idea/" + id, { due: e.target.value }); };
          el.querySelector('[data-act="approval"]').onchange = (e) => { idea.approval = e.target.checked; api("PATCH", "/idea/" + id, { approval: e.target.checked }); rerender(); };
          el.querySelector('[data-act="editor"]').onclick = () => openEditor(idea);
          el.querySelector('[data-act="results"]').onclick = () => openResults(idea);
          const rep = el.querySelector('[data-act="repurpose"]'); if (rep) rep.onclick = () => repurpose(idea);
          el.querySelectorAll('[data-act="measure"]').forEach((b) => b.onclick = () => openResults(idea));
          el.querySelector('[data-act="del"]').onclick = async () => { if (!confirm("Delete this idea?")) return; await api("DELETE", "/idea/" + id); DATA.ideas = DATA.ideas.filter((x) => x.id !== id); await loadInsights(); render(); };
          let t; el.querySelector('[data-act="draft"]').oninput = (e) => { idea.draft = e.target.value; clearTimeout(t); t = setTimeout(() => api("PATCH", "/idea/" + id, { draft: e.target.value }), 600); };
        });
      }
      function wireIdeas() {
        const cnew = $("c-new"); if (cnew) cnew.onclick = () => { TAB = "create"; render(); };
        const add = $("i-add");
        if (add) add.onclick = async () => { const v = $("i-title").value.trim(); if (!v) return; const r = await api("POST", "/idea", { title: v, owner: $("i-owner").value }); if (r && r.idea) { DATA.ideas.unshift(r.idea); $("i-title").value = ""; render(); } };
        const rerender = () => { const el = $("b-lanes"); if (!el) return; el.innerHTML = DATA.ideas.length ? boardLanes() : BOARD_EMPTY; wireCards(rerender); };
        ["b-search", "b-goal", "b-plat"].forEach((cid) => { const e = $(cid); if (e) { e.oninput = rerender; e.onchange = rerender; } });
        const appBtn = $("b-approval");
        if (appBtn) appBtn.onclick = () => { BOARD_APPROVAL = !BOARD_APPROVAL; appBtn.setAttribute("aria-pressed", BOARD_APPROVAL); appBtn.classList.toggle("on", BOARD_APPROVAL); rerender(); };
        const help = $("b-help");
        if (help) help.ontoggle = () => { try { localStorage.setItem("mkt-help", help.open ? "1" : "0"); } catch {} };
        const mon = $("mon-approve");
        if (mon) mon.onclick = () => { BOARD_APPROVAL = true; const ab = $("b-approval"); if (ab) { ab.setAttribute("aria-pressed", "true"); ab.classList.add("on"); } rerender(); const lanes = $("b-lanes"); if (lanes) lanes.scrollIntoView({ block: "start" }); };
        wireCards(rerender);
      }

      // ===== LIBRARY =====
      function panelLibrary() {
        return `<section class="panel" id="tab-library"><h1>Library</h1><p class="sub">Reusable building blocks + the anti-repetition angle picker (tap to grey out angles you've used on a topic).</p>
          <div class="card"><h2 style="margin-top:0">Content principles</h2><p class="muted" style="margin-top:0">Keep these in view before writing anything.</p><ul class="work-list">${CONTENT_PRINCIPLES.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>
          <div class="card"><h2 style="margin-top:0">🎬 Content formats — any kind of video</h2><p class="muted">Not just university topics — relatable, motivation, POV, lifestyle, career, reaction, trend formats. Tap "Use" to start one in Create.</p>${CREATIVE_PILLARS.map((p, i) => `<div class="head-item"><b>${esc(p.angle)}</b> <span class="pill">${esc(p.topic)}</span><div class="head-meta">${esc(p.format)} · <button class="link-mini" data-pillar="${i}">Use →</button></div></div>`).join("")}</div>
          <div class="card"><h2 style="margin-top:0">Angle picker</h2><div class="chips" id="lib-angles">${ANGLES.map((a) => `<button class="chip-btn" data-angle>${esc(a)}</button>`).join("")}</div></div>
          <div class="card"><h2 style="margin-top:0">Hook bank</h2>${HOOKS.map((h) => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><button class="btn sm alt" data-hook="${esc(h)}" style="margin-right:8px">Copy</button>${esc(h)}</div>`).join("")}</div>
          <div class="card"><h2 style="margin-top:0">Hook formulas</h2><p class="muted" style="margin-top:0">Reusable structures — the pattern is just the skeleton. Fill it only with real, sourced facts; never invent a number to fit it.</p>${HOOK_FORMULAS.map((f) => `<div class="head-item"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(f.name)}</b><button class="btn sm alt" data-hook="${esc(f.pattern)}">Copy pattern</button></div><div class="muted" style="margin-top:4px">${esc(f.pattern)}</div><div style="margin-top:4px;font-size:.86rem"><span class="pill teal">example</span> ${esc(f.eg)}</div></div>`).join("")}</div>
          <div class="card"><h2 style="margin-top:0">Formulas</h2>${FORMULAS.map((f) => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${f.name}</b><div class="muted">${f.steps.join(" → ")}</div></div>`).join("")}</div>
          <div class="card"><h2 style="margin-top:0">Writing craft</h2>
            <div class="head-item"><b>Tell it as a story</b><div class="muted" style="margin-top:4px">${esc(COPY_CRAFT.story)}</div></div>
            <div class="head-item"><b>End on a real question, not “like &amp; share”</b><div class="chips" style="margin-top:6px">${COPY_CRAFT.closers.map((c) => `<button class="btn sm alt" data-hook="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>
            <div class="head-item"><b>Openers to avoid</b><div class="muted" style="margin-top:4px">${COPY_CRAFT.avoid.map(esc).join(" · ")}</div></div></div>
          <div class="card"><h2 style="margin-top:0">CTAs</h2>${Object.entries(CTAS).map(([k, v]) => `<div style="padding:6px 0"><span class="pill">${k}</span> ${esc(v)}</div>`).join("")}</div></section>`;
      }
      function wireLibrary() {
        document.querySelectorAll("#tab-library [data-angle]").forEach((b) => b.onclick = () => b.classList.toggle("used"));
        document.querySelectorAll("#tab-library [data-hook]").forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.hook); const x = b.textContent; b.textContent = "Copied"; setTimeout(() => b.textContent = x, 1000); } catch {} });
        document.querySelectorAll("#tab-library [data-pillar]").forEach((b) => b.onclick = () => {
          const p = CREATIVE_PILLARS[+b.dataset.pillar]; if (!p) return;
          TAB = "create"; $("tabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.tab === "create")); render();
          setTimeout(() => { const el = $("c-idea"); if (el) { el.value = p.angle; const fs = $("c-formula"); if (fs) fs.value = p.formula; el.scrollIntoView({ block: "center" }); } }, 60);
        });
      }

      // ===== BRAND BRAIN =====
      const BRAIN_GROUPS = [
        { title: "Product & audience", fields: [["mission", "Mission"], ["product", "What Universo is"], ["audience", "Audience"], ["pains", "Student pains"], ["tone", "Tone of voice"], ["donot", "Hard rules (never do)"], ["facts", "Approved facts / numbers"], ["faqs", "FAQs"]] },
        { title: "Audience goals", fields: [["goal_audience", "Audience goals (grow followers, community, engagement, trust)"]] },
        { title: "Business goals", fields: [["biz_goals", "Business goals (universities, leads, traction, partnerships, investors, market opportunity, milestones)"]] },
        { title: "Investor positioning", note: "Only real, verifiable facts. Never invent traction, users, revenue, partnerships, investment or statistics — leave a field blank rather than guess.", fields: [["inv_problem", "What problem we're solving"], ["inv_why", "Why the problem matters"], ["inv_diff", "What makes Universo different"], ["traction", "Traction / progress (real only — blank if none yet)"], ["milestones", "Key milestones (real only)"], ["inv_model", "Business model"], ["inv_market", "Market opportunity"], ["inv_vision", "Vision"], ["inv_want", "What we want investors to understand"]] },
      ];
      const BRAIN_BIG = ["product", "pains", "faqs", "biz_goals", "goal_audience"];
      function panelBrain() {
        const ro = !isFounder(); // marketers can read the brand, only a founder edits it
        return `<section class="panel" id="tab-brain"><h1>Brand</h1><p class="sub">Universo's messaging + goals — injected into every prompt so you never re-explain. <b>Never invent traction, users, revenue, partnerships or numbers</b> — only real, verifiable facts.</p>
          ${ro ? `<div class="card muted">👀 View-only — the founder sets brand strategy. You'll see it reflected in every brief and script.</div>` : ""}
          ${BRAIN_GROUPS.map((gr) => `<h2>${esc(gr.title)}</h2>${gr.note ? `<p class="muted" style="margin:-4px 0 8px">${esc(gr.note)}</p>` : ""}${gr.fields.map(([k, l]) => `<div class="card"><label>${esc(l)}</label><textarea data-brain="${k}" rows="${BRAIN_BIG.includes(k) ? 5 : 3}" placeholder="${esc(l)}"${ro ? " readonly" : ""}>${esc(brain(k))}</textarea></div>`).join("")}`).join("")}</section>`;
      }
      function wireBrain() {
        document.querySelectorAll("[data-brain]").forEach((t) => { let tm; t.oninput = () => { DATA.brain[t.dataset.brain] = t.value; clearTimeout(tm); tm = setTimeout(() => api("PATCH", "/brain", { [t.dataset.brain]: t.value }), 600); }; });
      }

      boot();
    </script>
  </body>
</html>
