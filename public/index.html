<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1F3A" />
    <title>Universo — Discover universities abroad</title>
    <meta
      name="description"
      content="Universo helps international students discover and compare universities abroad."
    />
    <link rel="icon" href="/favicon.svg?v=3" />
    <!-- Preload only the `latin` subsets: they cover almost every page render,
         and arriving before first paint avoids a visible reflow when the body
         font swaps in. `latin-ext` stays lazy — it loads only when a page
         actually shows a diacritic. -->
    <link
      rel="preload"
      href="/fonts/publicsans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>

    <!-- Top navbar (desktop) -->
    <header class="topbar">
      <div class="topbar__inner">
        <a
          class="brand"
          href="/"
          data-link
          aria-label="Universo — Same Start. Equal Chance. Home"
        >
          <span class="brand__mark" aria-hidden="true">
            <!--BRAND_MARK-->
          </span>
          <span class="brand__wordmark">
            <span class="brand__name">Universo</span>
            <span class="brand__tag">Same Start. Equal Chance.</span>
          </span>
        </a>
        <div class="topbar__actions">
          <nav class="topnav" aria-label="Primary">
            <a href="/discover" data-link data-nav="discover">Discover</a>
            <a href="/scholarships" data-link data-nav="scholarships">Scholarships</a>
            <a href="/saved" data-link data-nav="saved">Shortlist</a>
            <a href="/journey" data-link data-nav="journey">Dream Plan</a>
            <a href="/account" data-link data-nav="account">Account</a>
            <a href="/for-universities">For universities</a>
          </nav>
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch colour theme"
            title="Switch theme"
          >
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.2 6.2 0 0 0 10.5 10.5z"/></svg>
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Route outlet -->
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <!-- Bottom tab navigation (mobile).
         Icons are inline SVG, not emoji: emoji render as full-colour OS glyphs
         that look different on every device and ignore the active-tab colour.
         These reuse the path data from the ICONS map in app.js and inherit
         currentColor, so the active tab tints its own icon. Inline rather than
         injected by app.js so the nav is complete before the deferred bundle runs. -->
    <nav class="tabbar" aria-label="Primary">
      <a href="/discover" data-link data-nav="discover" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </span>
        <span class="tabbar__label">Discover</span>
      </a>
      <a href="/scholarships" data-link data-nav="scholarships" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="9" r="5" />
            <path d="M8.5 13.5 7 22l5-2.5L17 22l-1.5-8.5" />
          </svg>
        </span>
        <span class="tabbar__label">Scholarships</span>
      </a>
      <a href="/saved" data-link data-nav="saved" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" />
          </svg>
        </span>
        <span class="tabbar__label">Shortlist</span>
      </a>
      <a href="/journey" data-link data-nav="journey" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="m15.5 8.5-2.2 5.3-5.3 2.2 2.2-5.3z" />
          </svg>
        </span>
        <span class="tabbar__label">Dream Plan</span>
      </a>
      <a href="/account" data-link data-nav="account" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
          </svg>
        </span>
        <span class="tabbar__label">Account</span>
      </a>
    </nav>

    <!-- Toast host -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- defer: don't block first paint on the SPA bundle; api.js must still run
       before app.js, and defer preserves document order. -->
    <script src="/js/api.js" defer></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
