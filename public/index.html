<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F3A" />
  <title>Universo — Discover universities abroad</title>
  <meta name="description" content="Universo helps international students discover and compare universities abroad." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='44' fill='%230B1F3A'/%3E%3Cpath fill='%23FFFFFF' d='M25 15 C5 55 30 130 100 180 C96 150 94 70 92 35 Z'/%3E%3Cpath fill='%23FFFFFF' d='M175 15 C195 55 170 130 100 180 C104 150 106 70 108 35 Z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>

  <!-- Top navbar (desktop) -->
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/discover" data-link aria-label="Universo — Same Start. Equal Chance. Go to Discover">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M25 15 C5 55 30 130 100 180 C96 150 94 70 92 35 Z"/>
            <path fill="currentColor" d="M175 15 C195 55 170 130 100 180 C104 150 106 70 108 35 Z"/>
          </svg>
        </span>
        <span class="brand__wordmark">
          <span class="brand__name">Universo</span>
          <span class="brand__tag">Same Start. Equal Chance.</span>
        </span>
      </a>
      <nav class="topnav" aria-label="Primary">
        <a href="/discover" data-link data-nav="discover">Discover</a>
        <a href="/saved" data-link data-nav="saved">Saved</a>
        <a href="/account" data-link data-nav="account">Account</a>
      </nav>
    </div>
  </header>

  <!-- Route outlet -->
  <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

  <!-- Bottom tab navigation (mobile) -->
  <nav class="tabbar" aria-label="Primary">
    <a href="/discover" data-link data-nav="discover" class="tabbar__item">
      <span class="tabbar__icon" aria-hidden="true">🔎</span>
      <span class="tabbar__label">Discover</span>
    </a>
    <a href="/saved" data-link data-nav="saved" class="tabbar__item">
      <span class="tabbar__icon" aria-hidden="true">🔖</span>
      <span class="tabbar__label">Saved</span>
    </a>
    <a href="/account" data-link data-nav="account" class="tabbar__item">
      <span class="tabbar__icon" aria-hidden="true">👤</span>
      <span class="tabbar__label">Account</span>
    </a>
  </nav>

  <!-- Toast host -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
