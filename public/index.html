<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1F3A" />
    <title>Universo — Discover universities abroad</title>
    <meta
      name="description"
      content="Universo helps international students discover and compare universities abroad."
    />
    <link rel="icon" href="/favicon.svg?v=2" />
    <!-- Preload only the `latin` subsets: they cover almost every page render,
         and arriving before first paint avoids a visible reflow when the body
         font swaps in. `latin-ext` stays lazy — it loads only when a page
         actually shows a diacritic. -->
    <link
      rel="preload"
      href="/fonts/publicsans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>

    <!-- Top navbar (desktop) -->
    <header class="topbar">
      <div class="topbar__inner">
        <a
          class="brand"
          href="/discover"
          data-link
          aria-label="Universo — Same Start. Equal Chance. Go to Discover"
        >
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <path
                fill="currentColor"
                d="M21.5 38.8 L28.6 42.7 L29.7 44.9 L65 70 L70.1 72.2 L80.6 80.6 L83.8 86.3 L85.3 86.8 L85.3 127.3 L86.1 127.8 L85.3 129.5 L85.7 146.7 L84.9 148 L86.1 148.9 L88.5 158.6 L94.7 164.8 L94.3 167 L92.4 165.2 L93.5 164.8 L92.8 163.9 L88.5 163.4 L80.6 158.6 L77.5 155.1 L29.4 120.3 L21.9 111 L19.2 101.3 L20 99.1 L19.2 88.5 L20.4 81.9 L19.6 67 L18.8 67.8 L20.4 60.8 L19.6 47.1 L20.4 39.6 Z"
              />
              <path
                fill="currentColor"
                d="M178.5 38.8 L171.4 42.7 L170.3 44.9 L135 70 L129.9 72.2 L119.4 80.6 L116.2 86.3 L114.7 86.8 L114.7 127.3 L113.9 127.8 L114.7 129.5 L114.3 146.7 L115.1 148 L113.9 148.9 L111.5 158.6 L105.3 164.8 L105.7 167 L107.6 165.2 L106.5 164.8 L107.2 163.9 L111.5 163.4 L119.4 158.6 L122.5 155.1 L170.6 120.3 L178.1 111 L180.8 101.3 L180 99.1 L180.8 88.5 L179.6 81.9 L180.4 67 L181.2 67.8 L179.6 60.8 L180.4 47.1 L179.6 39.6 Z"
              />
            </svg>
          </span>
          <span class="brand__wordmark">
            <span class="brand__name">Universo</span>
            <span class="brand__tag">Same Start. Equal Chance.</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Primary">
          <a href="/discover" data-link data-nav="discover">Discover</a>
          <a href="/journey" data-link data-nav="journey">Dream Plan</a>
          <a href="/saved" data-link data-nav="saved">Saved</a>
          <a href="/account" data-link data-nav="account">Account</a>
          <a href="/for-universities">For universities</a>
        </nav>
      </div>
    </header>

    <!-- Route outlet -->
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <!-- Bottom tab navigation (mobile).
         Icons are inline SVG, not emoji: emoji render as full-colour OS glyphs
         that look different on every device and ignore the active-tab colour.
         These reuse the path data from the ICONS map in app.js and inherit
         currentColor, so the active tab tints its own icon. Inline rather than
         injected by app.js so the nav is complete before the deferred bundle runs. -->
    <nav class="tabbar" aria-label="Primary">
      <a href="/discover" data-link data-nav="discover" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </span>
        <span class="tabbar__label">Discover</span>
      </a>
      <a href="/journey" data-link data-nav="journey" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="m15.5 8.5-2.2 5.3-5.3 2.2 2.2-5.3z" />
          </svg>
        </span>
        <span class="tabbar__label">Dream Plan</span>
      </a>
      <a href="/saved" data-link data-nav="saved" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" />
          </svg>
        </span>
        <span class="tabbar__label">Saved</span>
      </a>
      <a href="/account" data-link data-nav="account" class="tabbar__item">
        <span class="tabbar__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
          </svg>
        </span>
        <span class="tabbar__label">Account</span>
      </a>
    </nav>

    <!-- Toast host -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- defer: don't block first paint on the SPA bundle; api.js must still run
       before app.js, and defer preserves document order. -->
    <script src="/js/api.js" defer></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
