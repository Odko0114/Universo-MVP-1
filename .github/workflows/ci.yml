name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Seed data isn't committed in full (only the cached ETER import is);
      # tests need data/universities.json to exist, so build it from the
      # curated set + whatever seed caches are checked in.
      - run: npm run seed

      - run: npm --prefix join-app ci
      - run: npm run build:join

      - run: npm test

      - run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
